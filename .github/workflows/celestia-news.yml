name: Crypto Atlas - Celestia News Collection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: celestia-news-collection
  cancel-in-progress: false

jobs:
  collect-celestia-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect Celestia sources for editorial review
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urldefrag, urlsplit, urlunsplit

          OUTPUT = Path('data/celestia-news-review.json')
          API = 'https://api.github.com'
          NOW = lambda: datetime.now(timezone.utc).isoformat()

          class TextExtractor(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self, data): self.parts.append(data)

          def clean_text(value):
              p=TextExtractor(); p.feed(value or '')
              return re.sub(r'\s+', ' ', unescape(' '.join(p.parts))).strip()
          def local_name(e): return e.tag.rsplit('}',1)[-1].lower()
          def child_text(e,names):
              names={x.lower() for x in names}
              for c in e:
                  if local_name(c) in names:
                      v=''.join(c.itertext()).strip()
                      if v: return v
              return ''
          def normalize_url(url):
              url,_=urldefrag((url or '').strip()); p=urlsplit(url)
              if p.scheme.lower()!='https' or not p.hostname: return ''
              return urlunsplit(('https',p.netloc,p.path,p.query,''))
          def parse_date(raw):
              if not raw: return ''
              try:
                  try: d=parsedate_to_datetime(raw)
                  except (ValueError,TypeError,OverflowError): d=datetime.fromisoformat(raw.replace('Z','+00:00'))
                  if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
                  return d.astimezone(timezone.utc).isoformat()
              except (ValueError,TypeError,OverflowError): return raw

          def request_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':'CryptoAtlasNews/1.0','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.loads(r.read(8_000_000))
          def request_bytes(url,accept='application/rss+xml, application/atom+xml, application/xml, text/xml'):
              req=urllib.request.Request(url,headers={'User-Agent':'CryptoAtlasNews/1.0','Accept':accept})
              with urllib.request.urlopen(req,timeout=30) as r: return r.read(5_000_000)
          def parse_feed(data):
              try: return ET.fromstring(data)
              except ET.ParseError:
                  data=re.sub(rb'&(?!amp;|lt;|gt;|apos;|quot;|#\d+;|#x[0-9a-fA-F]+;)',b'&amp;',data)
                  return ET.fromstring(data)
          def blog_category(title):
              t=title.lower()
              if any(w in t for w in ('research','benchmark','tps','cryptography','proof','security','sampling','erasure coding')): return 'research'
              if any(w in t for w in ('protocol','scaling','data availability','modular','blockspace','rollup','network','node','validator','consensus','architecture','upgrade','mainnet','testnet','developer','integration','interoperability')): return 'technology'
              if any(w in t for w in ('ecosystem','partnership','partner','launch','project','case study','application','payments','stablecoin','exchange','builder')): return 'ecosystem'
              return 'official'
          def collect_blog():
              root=parse_feed(request_bytes('https://blog.celestia.org/rss/'))
              out=[]
              for e in root.iter():
                  if local_name(e) not in ('item','entry'): continue
                  title=clean_text(child_text(e,('title',)))
                  links=[]
                  for c in e:
                      if local_name(c)=='link':
                          href=c.attrib.get('href','').strip(); rel=c.attrib.get('rel','alternate').lower(); txt=(c.text or '').strip()
                          if href: links.append((rel,href))
                          elif txt: links.append(('alternate',txt))
                  link=next((u for rel,u in links if rel=='alternate'), links[0][1] if links else '')
                  url=normalize_url(link)
                  if not title or not url: continue
                  desc=[]; cats=[]
                  for c in e:
                      n=local_name(c)
                      if n in ('description','encoded','summary','content'):
                          v=clean_text(''.join(c.itertext()))
                          if v and v not in desc: desc.append(v)
                      if n=='category':
                          v=clean_text(c.attrib.get('term') or ''.join(c.itertext()))
                          if v and v not in cats: cats.append(v)
                  out.append(dict(title=title,url=url,date=parse_date(child_text(e,('pubDate','published','updated','date'))),source='Celestia Blog',sourceType='official',category=blog_category(title),description=max(desc,key=len) if desc else '',feedCategories=cats))
              if not out: raise RuntimeError('Celestia Blog RSS returned no usable entries')
              return out

          def collect_releases(repo, label):
              releases=request_json(f'{API}/repos/{repo}/releases?per_page=100')
              if not isinstance(releases,list): raise RuntimeError(f'Unexpected releases response for {repo}')
              stable=[r for r in releases if not r.get('draft') and not r.get('prerelease') and r.get('tag_name')]
              stable.sort(key=lambda r: r.get('published_at') or r.get('created_at') or '', reverse=True)
              return [dict(title=f"{label} {r['tag_name']}",url=r.get('html_url',''),date=parse_date(r.get('published_at') or r.get('created_at')),source=label,sourceType='official',category='technology',description=clean_text(r.get('body','')),feedCategories=['GitHub Release'],_release_tag=r['tag_name'],_release_repo=repo) for r in stable if normalize_url(r.get('html_url',''))]

          def parse_cip_metadata(content):
              meta={}
              for line in content.splitlines():
                  m=re.match(r'^\s*\|\s*([^|]+?)\s*\|\s*([^|]*?)\s*\|\s*$',line)
                  if m:
                      k=m.group(1).strip().lower().replace(' ','-'); v=m.group(2).strip()
                      if k in ('title','description','author','status','type','category','created','withdrawal-reason') and v: meta[k]=v
              return meta

          def cip_item(path, sha, content):
              m=re.fullmatch(r'cips/cip-(\d+)\.md',path)
              if not m: return None
              meta=parse_cip_metadata(content)
              num=int(m.group(1)); title=meta.get('title',f'CIP-{num}')
              return dict(title=f"CIP-{num}: {title}",url=f'https://github.com/celestiaorg/CIPs/blob/{sha}/{path}',date=parse_date(meta.get('created','')),source='Celestia Improvement Proposals',sourceType='official',category='technology',description=meta.get('description',''),feedCategories=['CIP',meta.get('status','Unknown'),meta.get('type','')],cip_number=num,cip_status=meta.get('status',''),cip_type=meta.get('type',''),cip_category=meta.get('category',''),_cip_path=path,_cip_sha=sha)

          def collect_cips(state):
              repo='celestiaorg/CIPs'
              head=request_json(f'{API}/repos/{repo}/commits/main')['sha']
              base=state.get('cip_baseline_sha')
              if not base:
                  return [], {'cip_baseline_sha':head}, 'baseline'
              if base==head: return [], {'cip_baseline_sha':head}, 'unchanged'
              compare=request_json(f'{API}/repos/{repo}/compare/{base}...{head}')
              if compare.get('status') not in ('ahead','identical') or compare.get('total_commits',0)>250 or compare.get('total_commits',0)>=250:
                  raise RuntimeError('CIP compare range is not safely complete; baseline was not advanced')
              files=compare.get('files')
              if not isinstance(files,list) or compare.get('total_commits',0)>0 and compare.get('status')=='ahead' and len(files)>=300:
                  raise RuntimeError('CIP compare response may be truncated; baseline was not advanced')
              changed={}
              for f in files:
                  path=f.get('filename','')
                  if re.fullmatch(r'cips/cip-\d+\.md',path) and f.get('status')!='removed': changed[path]=f.get('sha')
              items=[]
              for path, blob_sha in changed.items():
                  if not blob_sha: continue
                  # Read the current file at the compared head, not an intermediate revision.
                  raw=request_bytes(f'https://raw.githubusercontent.com/{repo}/{head}/{path}',accept='text/plain')
                  item=cip_item(path,head,raw.decode('utf-8','replace'))
                  if item: items.append(item)
              return items, {'cip_baseline_sha':head}, 'updated'

          def main():
              if OUTPUT.exists():
                  old_data=json.loads(OUTPUT.read_text(encoding='utf-8'))
                  if not isinstance(old_data,dict) or not isinstance(old_data.get('items'),list): raise RuntimeError('Existing review JSON is invalid; stopping without overwrite')
              else: old_data={'items':[]}
              previous=old_data['items']; existing={x.get('url'):x for x in previous if isinstance(x,dict) and x.get('url')}
              state=old_data.get('source_state',{})
              if not isinstance(state,dict): state={}
              source_results=[]; errors=[]; new_items=[]; next_state=dict(state)
              sources=[('Celestia Blog',collect_blog)]
              for name,fn in sources:
                  try: source_results.extend(fn()); print(name+': success')
                  except Exception as e: errors.append(name); print(name+': FAILED - '+str(e))
              # Releases: only newest stable on bootstrap; subsequently every unobserved tag in returned window.
              for repo,label,key in [('celestiaorg/celestia-app','Celestia App','celestia_app_seen_tags'),('celestiaorg/celestia-node','Celestia Node','celestia_node_seen_tags')]:
                  try:
                      releases=collect_releases(repo,label); seen=set(state.get(key,[])); tags=[x['_release_tag'] for x in releases]
                      if key not in state:
                          chosen=releases[:1]
                          # Mark the whole fetched history as seen, but import only its newest stable release.
                          next_state[key]=tags
                      else:
                          chosen=[x for x in releases if x['_release_tag'] not in seen]
                          next_state[key]=list(dict.fromkeys(list(state.get(key,[]))+tags))[-1000:]
                      source_results.extend(chosen); print(label+': success; new releases='+str(len(chosen)))
                  except Exception as e: errors.append(label); print(label+': FAILED - '+str(e))
              try:
                  cips, cip_state, cip_mode=collect_cips(state); next_state.update(cip_state); source_results.extend(cips)
                  if cip_mode=='baseline': print('CIPs: baseline initialized; no historical proposals imported')
                  else: print('CIPs: success; changed proposals='+str(len(cips)))
              except Exception as e: errors.append('CIPs'); print('CIPs: FAILED - '+str(e))
              successful=4-len(errors)
              if successful==0: raise RuntimeError('All Celestia sources failed; review JSON was not changed')
              technical={'title','url','date','source','sourceType','category','description','feedCategories','cip_number','cip_status','cip_type','cip_category'}
              added=0
              for fresh in source_results:
                  url=normalize_url(fresh.get('url',''))
                  if not url: continue
                  fresh['url']=url
                  old=existing.get(url)
                  # CIPs are revisions of one proposal: keep one current review record per CIP number.
                  if old is None and fresh.get('source')=='Celestia Improvement Proposals':
                      old=next((x for x in existing.values() if x.get('source')=='Celestia Improvement Proposals' and x.get('cip_number')==fresh.get('cip_number')),None)
                  if old is not None and old.get('status','pending')!='pending':
                      # Never rewrite a reviewed/approved/rejected editorial record.
                      continue
                  if old is None:
                      item={k:v for k,v in fresh.items() if not k.startswith('_')}
                      item.update(status='pending',published=False,collected_at=NOW())
                      # No guessed editorial classification for new blog material.
                      if item.get('source')=='Celestia Blog':
                          item.pop('atlasCategory',None); item.pop('materialType',None)
                      else:
                          item['atlasCategory']='Crypto & Technology'; item['materialType']='Official Update' if item.get('source')!='Celestia Improvement Proposals' else 'Protocol Proposal'
                      existing[url]=item; added+=1
                  else:
                      merged=dict(old)
                      for k in technical:
                          if k in fresh: merged[k]=fresh[k]
                      # preserve every non-technical/editorial field from old, including unknown future fields
                      existing.pop(old.get('url'),None)
                      existing[url]=merged
              results=list(existing.values())
              def sort_key(x):
                  d=parse_date(x.get('date',''))
                  try: return datetime.fromisoformat(d.replace('Z','+00:00')).timestamp()
                  except Exception: return 0
              results.sort(key=sort_key,reverse=True)
              out=dict(old_data)
              out.update(source='Crypto Atlas Celestia News Review',updated_at=NOW(),successful_feeds=successful,items=results,source_state=next_state,successful_sources=4-len(errors),failed_sources=errors)
              OUTPUT.parent.mkdir(parents=True,exist_ok=True); OUTPUT.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(f'Successful sources: {successful}/4; new records: {added}; total records: {len(results)}')

          if __name__=='__main__': main()
          PY

      - name: Save collected publications
        run: |
          if [ -n "$(git status --porcelain -- data/celestia-news-review.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/celestia-news-review.json
            git commit -m "Update Celestia news review queue"
            git push
          else
            echo "No changes in Celestia review queue."
          fi
