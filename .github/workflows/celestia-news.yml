
name: Crypto Atlas - Celestia News Collection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: celestia-news-collection
  cancel-in-progress: false

jobs:
  collect-celestia-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect Celestia RSS publications
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urldefrag, urlsplit, urlunsplit

          OUTPUT = Path("data/celestia-news-review.json")

          SOURCE = {
              "name": "Celestia Blog",
              "type": "official",
              "url": "https://blog.celestia.org/rss/",
          }

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)

          def clean_text(value):
              parser = TextExtractor()
              parser.feed(value or "")
              return re.sub(
                  r"\s+",
                  " ",
                  unescape(" ".join(parser.parts))
              ).strip()

          def local_name(element):
              return element.tag.rsplit("}", 1)[-1].lower()

          def child_text(element, names):
              names = {name.lower() for name in names}

              for child in element:
                  if local_name(child) in names:
                      value = "".join(child.itertext()).strip()
                      if value:
                          return value

              return ""

          def get_link(entry):
              links = []

              for child in entry:
                  if local_name(child) != "link":
                      continue

                  href = child.attrib.get("href", "").strip()
                  rel = child.attrib.get("rel", "alternate").lower()
                  text = (child.text or "").strip()

                  if href:
                      links.append((rel, href))
                  elif text:
                      links.append(("alternate", text))

              for preferred_rel in ("alternate", ""):
                  for rel, url in links:
                      if rel == preferred_rel:
                          return url

              return links[0][1] if links else ""

          def normalize_url(url):
              url = url.strip()

              if not url:
                  return ""

              url, _ = urldefrag(url)
              parts = urlsplit(url)

              if parts.scheme.lower() != "https" or not parts.hostname:
                  return ""

              return urlunsplit((
                  "https",
                  parts.netloc,
                  parts.path,
                  parts.query,
                  ""
              ))

          def parse_date(raw):
              if not raw:
                  return "", 0

              try:
                  try:
                      parsed = parsedate_to_datetime(raw)
                  except (ValueError, TypeError, OverflowError):
                      parsed = datetime.fromisoformat(
                          raw.replace("Z", "+00:00")
                      )

                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)

                  parsed = parsed.astimezone(timezone.utc)

                  return parsed.isoformat(), parsed.timestamp()

              except (ValueError, TypeError, OverflowError):
                  return raw, 0

          def get_entry_date(entry):
              raw = child_text(
                  entry,
                  ("pubDate", "published", "updated", "date")
              )
              return parse_date(raw)

          def get_description(entry):
              descriptions = []

              for child in entry:
                  if local_name(child) in (
                      "description",
                      "encoded",
                      "summary",
                      "content"
                  ):
                      value = clean_text(
                          "".join(child.itertext())
                      )

                      if value and value not in descriptions:
                          descriptions.append(value)

              if not descriptions:
                  return ""

              return max(descriptions, key=len)

          def get_categories(entry):
              categories = []

              for child in entry:
                  if local_name(child) == "category":
                      value = (
                          child.attrib.get("term")
                          or "".join(child.itertext())
                      )
                      value = clean_text(value)

                      if value and value not in categories:
                          categories.append(value)

              return categories

          def get_category(title):
              text = title.lower()

              research_words = (
                  "research",
                  "benchmark",
                  "tps",
                  "cryptography",
                  "proof",
                  "security",
                  "sampling",
                  "erasure coding",
              )

              technology_words = (
                  "protocol",
                  "scaling",
                  "data availability",
                  "modular",
                  "blockspace",
                  "rollup",
                  "network",
                  "node",
                  "validator",
                  "consensus",
                  "architecture",
                  "upgrade",
                  "mainnet",
                  "testnet",
                  "developer",
                  "integration",
                  "interoperability",
              )

              ecosystem_words = (
                  "ecosystem",
                  "partnership",
                  "partner",
                  "launch",
                  "project",
                  "case study",
                  "application",
                  "payments",
                  "stablecoin",
                  "exchange",
                  "builder",
              )

              if any(word in text for word in research_words):
                  return "research"

              if any(word in text for word in technology_words):
                  return "technology"

              if any(word in text for word in ecosystem_words):
                  return "ecosystem"

              return "official"

          def fetch_feed(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "CryptoAtlasNews/1.0",
                      "Accept": (
                          "application/rss+xml, "
                          "application/atom+xml, "
                          "application/xml, text/xml"
                      ),
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  data = response.read(5_000_000)

              try:
                  return ET.fromstring(data)
              except ET.ParseError:
                  repaired = re.sub(
                      rb"&(?!amp;|lt;|gt;|apos;|quot;|#\d+;|#x[0-9a-fA-F]+;)",
                      b"&amp;",
                      data
                  )
                  return ET.fromstring(repaired)

          def collect_publications():
              root = fetch_feed(SOURCE["url"])
              entries = [
                  element
                  for element in root.iter()
                  if local_name(element) in ("item", "entry")
              ]

              collected = []

              for entry in entries:
                  title = clean_text(
                      child_text(entry, ("title",))
                  )

                  link = normalize_url(get_link(entry))

                  if not title or not link:
                      continue

                  date, sort_date = get_entry_date(entry)
                  description = get_description(entry)

                  collected.append({
                      "title": title,
                      "url": link,
                      "date": date,
                      "source": SOURCE["name"],
                      "sourceType": SOURCE["type"],
                      "category": get_category(title),
                      "description": description,
                      "feedCategories": get_categories(entry),
                      "status": "pending",
                      "published": False,
                      "_sort_date": sort_date,
                  })

              return collected

          def existing_sort_date(article):
              _, timestamp = parse_date(article.get("date", ""))
              return timestamp

          previous = []

          if OUTPUT.exists():
              try:
                  old_data = json.loads(
                      OUTPUT.read_text(encoding="utf-8")
                  )

                  previous = old_data.get("items", [])

                  if not isinstance(previous, list):
                      raise ValueError("The items field is not a list.")

              except (json.JSONDecodeError, AttributeError, ValueError):
                  raise RuntimeError(
                      "Existing Celestia review file is invalid. "
                      "Stopping to protect editorial decisions."
                  )

          articles = collect_publications()

          if not articles:
              raise RuntimeError(
                  "The Celestia feed returned zero usable publications. "
                  "Existing review data was not changed."
              )

          existing = {
              item["url"]: item
              for item in previous
              if isinstance(item, dict) and item.get("url")
          }

          new_count = 0

          for article in articles:
              url = article["url"]
              old = existing.get(url)

              if old:
                  old_status = old.get("status", "pending")

                  # Preserve every field of an already reviewed article.
                  if old_status != "pending":
                      continue

                  # Refresh pending feed data, but preserve editorial notes.
                                    for field in (
                      "atlasCategory",
                      "materialType",
                      "status",
                      "published",
                      "collected_at",
                      "reviewed_at",
                      "review_note",
                  ):
                      if field in old:
                          article[field] = old[field]

                  existing[url] = article

              else:
                  article["collected_at"] = (
                      datetime.now(timezone.utc).isoformat()
                  )
                  existing[url] = article
                  new_count += 1

          results = list(existing.values())

          results.sort(
              key=existing_sort_date,
              reverse=True
          )

          for article in results:
              article.pop("_sort_date", None)

          data = {
              "source": "Crypto Atlas Celestia News Review",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "successful_feeds": 1,
              "items": results,
          }

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          OUTPUT.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Celestia Blog: RSS collection successful.")
          print(f"Publications collected: {len(articles)}")
          print(f"New publications: {new_count}")
          print(f"Total review records: {len(results)}")
          print(f"Saved to {OUTPUT}")

          PY

      - name: Save collected publications
        run: |
          if [ -n "$(git status --porcelain -- data/celestia-news-review.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/celestia-news-review.json
            git commit -m "Update Celestia news review queue"
            git push
          else
            echo "No changes in Celestia review queue."
          fi
