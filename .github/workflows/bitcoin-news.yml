
name: Crypto Atlas - Bitcoin Core News

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  collect-bitcoin-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch official Bitcoin Core releases
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://api.github.com/repos/bitcoin/bitcoin/releases?per_page=10"

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "Crypto-Atlas-News"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              releases = json.load(response)

          items = []

          for release in releases:
              if release.get("draft", False):
                  continue

              items.append({
                  "title": release.get("name") or release.get("tag_name"),
                  "version": release.get("tag_name"),
                  "url": release.get("html_url"),
                  "published_at": release.get("published_at"),
                  "description": release.get("body") or "",
                  "prerelease": release.get("prerelease", False)
              })

          data = {
              "source": "Bitcoin Core official releases",
              "source_url": "https://github.com/bitcoin/bitcoin/releases",
              "items": items
          }

          path = Path("data/bitcoin-core-releases.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"Successfully collected {len(items)} releases.")
          PY

      - name: Save changes if needed
        run: |
          if git diff --quiet -- data/bitcoin-core-releases.json; then
            echo "No new or changed release data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/bitcoin-core-releases.json
            git commit -m "Update Bitcoin Core releases feed"
            git push
          fi
