
name: European Commission News

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch and filter official news
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import timezone
          from email.utils import parsedate_to_datetime
          from html import unescape
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          RSS_URLS = [
              "https://finance.ec.europa.eu/node/2/rss_en",
              "https://finance.ec.europa.eu/node/1408/rss_en",
              "https://www.ecb.europa.eu/rss/press.html"
          ]

          ALLOWED_HOSTS = {
              "finance.ec.europa.eu",
              "www.ecb.europa.eu",
              "ecb.europa.eu"
          }

          OUTPUT = "data/european-commission-news.json"

          CORE_KEYWORDS = [
              "crypto", "crypto-asset", "crypto asset",
              "mica", "markets in crypto-assets",
              "tokenisation", "tokenization",
              "distributed ledger", "dlt",
              "blockchain", "stablecoin", "stable coin",
              "digital asset", "digital assets",
              "crypto-asset service provider",
              "crypto asset service provider", "casp",
              "digital euro",
              "pontes", "appia"
          ]

          TITLE_ONLY_KEYWORDS = [
              "digital finance", "digital financial",
              "fintech", "financial technology",
              "financial technologies"
          ]
          
          class MetaExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.description = ""
                  self.in_description = False

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "meta":
                      return

                  attrs = {
                      key.lower(): value
                      for key, value in attrs
                  }

                  name = (
                      attrs.get("name")
                      or attrs.get("property")
                      or ""
                  ).lower()

                  if name in (
                      "description",
                      "og:description",
                      "twitter:description"
                  ) and not self.description:
                      self.description = (
                          attrs.get("content") or ""
                      ).strip()

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)

          def clean_html(value):
              parser = TextExtractor()
              parser.feed(value or "")
              return re.sub(
                  r"\s+", " ",
                  unescape(" ".join(parser.parts))
              ).strip()
         
          def fetch_feed(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "CryptoAtlasNews/1.0"}
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  return ET.fromstring(response.read())

          def fetch_page_description(url):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "CryptoAtlasNews/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request, timeout=8
                  ) as response:
                      final_url = response.geturl()
                      parsed = urlparse(final_url)

                      if (
                          parsed.scheme != "https"
                          or parsed.hostname not in ALLOWED_HOSTS
                      ):
                          return ""

                      content_type = response.headers.get(
                          "Content-Type", ""
                      ).lower()

                      if "text/html" not in content_type:
                          return ""

                      html = response.read(500_000).decode(
                          "utf-8", errors="replace"
                      )

                  parser = MetaExtractor()
                  parser.feed(html)

                  return clean_html(parser.description)[:1000]

              except Exception as error:
                  print(
                      f"Could not retrieve page description: {error}"
                  )
                  return ""
          def contains_keyword(text, keyword):
              pattern = (
                  r"(?<![a-z0-9])"
                  + re.escape(keyword.lower()).replace(" ", r"\s+")
                  + r"(?![a-z0-9])"
              )
              return re.search(pattern, text.lower()) is not None
              
          results = []
          seen = set()
          successful_feeds = 0

          for rss_url in RSS_URLS:
              try:
                  root = fetch_feed(rss_url)
                  successful_feeds += 1
                  print(f"Successfully fetched: {rss_url}")

              except Exception as error:
                  print(f"WARNING: Could not fetch {rss_url}: {error}")
                  continue

              for item in root.findall(".//item"):
                  title = clean_html(
                      item.findtext("title", "")
                  )
                  description = clean_html(
                      item.findtext("description", "")
                  )
                  link = item.findtext("link", "").strip()

                  if not title or not link:
                      continue

                  parsed_link = urlparse(link)

                  if (
                      parsed_link.scheme != "https"
                      or parsed_link.hostname not in ALLOWED_HOSTS
                  ):
                      continue

                  categories = [
                      clean_html(category.text or "")
                      for category in item.findall("category")
                  ]

                  title_search = title.lower()
                  searchable = " ".join(
                      [title, description] + categories
                  ).lower()

                  
                  core_match = any(
                      contains_keyword(searchable, word)
                      for word in CORE_KEYWORDS
                  )

                  broad_title_match = any(
                      contains_keyword(title_search, word)
                      for word in TITLE_ONLY_KEYWORDS
                  )


                  if not (core_match or broad_title_match):
                      continue

                  if link in seen:
                      continue
                  
                  if not description:
                      description = fetch_page_description(link)

                  if (
                      not description
                      and title == (
                          "Piero Cipollone: Pontes and Appia: "
                          "unlocking opportunities for banks"
                      )
                  ):
                      description = (
                          "Presentation by Piero Cipollone, Member "
                          "of the Executive Board of the ECB, to the "
                          "Executive Committee of the Italian Banking "
                          "Association."
                      )

                  seen.add(link)

                  raw_date = item.findtext(
                      "pubDate", ""
                  ).strip()
                  date = raw_date
                  sort_date = 0

                  if raw_date:
                      try:
                          parsed = parsedate_to_datetime(raw_date)

                          if parsed.tzinfo is None:
                              parsed = parsed.replace(
                                  tzinfo=timezone.utc
                              )

                          sort_date = parsed.timestamp()
                          date = parsed.strftime("%Y-%m-%d")

                      except (
                          ValueError, TypeError, OverflowError
                      ):
                          pass

                  results.append({
                      "title": title,
                      "link": link,
                      "pubDate": date,
                      "description": description,
                      "_sort_date": sort_date
                  })

          if successful_feeds == 0:
              raise RuntimeError(
                  "All European Commission and ECB RSS feeds failed."
              )

          results.sort(
              key=lambda article: article["_sort_date"],
              reverse=True
          )

          results = results[:20]

          for article in results:
              article.pop("_sort_date", None)

          os.makedirs("data", exist_ok=True)

          with open(OUTPUT, "w", encoding="utf-8") as file:
              json.dump(
                  results, file, ensure_ascii=False, indent=2
              )
              file.write("\n")

          print(f"Feeds successfully fetched: {successful_feeds}")
          print(f"Saved {len(results)} relevant articles.")

          PY

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/european-commission-news.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update European Commission news"
            git push
          fi
