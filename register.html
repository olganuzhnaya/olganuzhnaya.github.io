<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — Crypto Atlas</title>

    <meta
        name="description"
        content="Create your Crypto Atlas account."
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        CRYPTO ATLAS
    </div>


    <nav>

        <a href="index.html">
            HOME
        </a>

        <a href="index.html#assets">
            ASSETS
        </a>

        <a href="index.html#market">
            MARKET
        </a>

        <a href="index.html#news">
            NEWS
        </a>

        <a href="education/index.html">
            EDUCATION
        </a>

        <a href="index.html#law">
            LAW
        </a>

    </nav>

</header>



<main>


<section class="education-article">


    <h1>
        Create Your Account
    </h1>


    <p>
        Join Crypto Atlas and explore the world of digital assets,
        blockchain technology, economics and knowledge.
    </p>



    <form id="register-form">


        <label for="name">
            Name
        </label>


        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >



        <label for="email">
            Email
        </label>


        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >



        <label for="password">
            Password
        </label>


        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
            minlength="6"
        >



        <label for="confirm-password">
            Confirm Password
        </label>


        <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm your password"
            required
            minlength="6"
        >



        <button type="submit">
            CREATE ACCOUNT
        </button>


    </form>



    <p id="status"></p>



    <p>
        Already have an account?
    </p>


    <p>
        <a href="login.html">
            Login
        </a>
    </p>



</section>


</main>



<footer>

    <p>
        Crypto Atlas — information, sources and data.
    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>


<script>

    const registerForm =
        document.getElementById("register-form");

    const status =
        document.getElementById("status");


    registerForm.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirm-password").value;


            if (password !== confirmPassword) {

                status.textContent =
                    "ERROR: Passwords do not match.";

                return;

            }


            status.textContent =
                "Creating account...";


            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {
                            name: name
                        }

                    }

                });


            if (error) {

                console.error(error);

                status.textContent =
                    "ERROR: " + error.message;

                return;

            }


            console.log("Registration:", data);


            status.textContent =
                "SUCCESS: Account created. Please check your email to confirm your account.";

        }
    );

</script>


</body>

</html>
