<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Crypto Atlas</title>

    <meta
        name="description"
        content="Login to your Crypto Atlas account."
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>


<header>

    <div class="logo">
        CRYPTO ATLAS
    </div>


    <nav>
        <a href="index.html">HOME</a>
        <a href="index.html#assets">ASSETS</a>
        <a href="index.html#market">MARKET</a>
        <a href="index.html#news">NEWS</a>
        <a href="education/index.html">EDUCATION</a>
        <a href="index.html#law">LAW</a>
    </nav>

</header>



<main>


<section class="education-article">


    <h1>Login</h1>


    <p>
        Access your Crypto Atlas account.
    </p>


    <form>


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
        >



        <label for="password">
            Password
        </label>


        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
        >



        <button type="submit">
            LOGIN
        </button>


    </form>



    <p>
        Don't have an account?
    </p>


    <p>
        <a href="register.html">
            Create an account
        </a>
    </p>



</section>


</main>




<footer>

    <p>
        Crypto Atlas — information, sources and data.
    </p>

</footer>


</body>

</html>
