<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Crypto Atlas</title>

    <meta
        name="description"
        content="Login to your Crypto Atlas account."
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>


<header>

    <div class="logo">
        CRYPTO ATLAS
    </div>


    <nav>
        <a href="index.html">HOME</a>
        <a href="index.html#assets">ASSETS</a>
        <a href="index.html#market">MARKET</a>
        <a href="index.html#news">NEWS</a>
        <a href="education/index.html">EDUCATION</a>
        <a href="index.html#law">LAW</a>
    </nav>

</header>



<main>


<section class="education-article">


    <h1>Login</h1>


    <p>
        Access your Crypto Atlas account.
    </p>


    <form id="login-form">


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >



        <label for="password">
            Password
        </label>


        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >



        <button type="submit">
            LOGIN
        </button>


    </form>


    <p id="status"></p>



    <p>
        Don't have an account?
    </p>


    <p>
        <a href="register.html">
            Create an account
        </a>
    </p>



</section>


</main>




<footer>

    <p>
        Crypto Atlas — information, sources and data.
    </p>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase-config.js"></script>


<script>

    const loginForm =
        document.getElementById("login-form");

    const status =
        document.getElementById("status");


    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        status.textContent =
            "Logging in...";


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            console.error(error);

            status.textContent =
                "ERROR: " + error.message;

            return;

        }


        console.log("Logged in:", data.user);

        status.textContent =
            "SUCCESS: Login successful.";

    });

</script>


</body>

</html>
