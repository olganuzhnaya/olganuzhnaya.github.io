<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password Test — Crypto Atlas</title>

</head>


<body>

    <h1>Crypto Atlas — Forgot Password</h1>

    <p>
        Enter your email address to receive a password recovery link.
    </p>


    <form id="forgot-form">

        <label for="email">
            Email address
        </label>

        <br>

        <input
            type="email"
            id="email"
            required
        >

        <br><br>


        <button type="submit">
            Send Password Recovery Email
        </button>

    </form>


    <p id="status"></p>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>


    <script>

        const form =
            document.getElementById("forgot-form");

        const status =
            document.getElementById("status");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                document.getElementById("email").value.trim();


            status.textContent =
                "Sending password recovery email...";


            const { error } =
                await supabaseClient.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            "https://olganuzhnaya.github.io/supabase-reset-password-test.html"
                    }
                );


            if (error) {

                console.error(error);

                status.textContent =
                    "ERROR: " + error.message;

                return;

            }


            status.textContent =
                "SUCCESS: Password recovery email sent.";

        });

    </script>


</body>

</html>
